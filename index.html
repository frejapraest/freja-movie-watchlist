<!doctype html>
<html lang="en">
  <head>
    <script defer src="./index.js" type="module"></script>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/49427dc57c.js"
      crossorigin="anonymous"
    ></script>
    <title>Find film</title>
  </head>
  <body>
    <header>
      <h1>Find your film</h1>
      <a href="./watchlist.html">My Watchlist</a>
      <div class="search-container">
        <div class="search">
          <i class="fa-solid grey fa-magnifying-glass"></i>
          <input
            type="search"
            class="movie-search"
            id="movie-search"
            name="search"
            placeholder="Search for a movie"
          />
          <button class="search-button" id="search-button" tabindex="0">
            Search
          </button>
        </div>
      </div>
    </header>
    <main>
      <div class="placeholder-container" id="placeholder-container">
        <i class="fa-solid fa-film grey"></i>
        <h2 class="grey">Start exploring</h2>
      </div>
      <div class="no-movie-results hidden" id="no-movie-results">
        <h2 class="no-movie-text">
          Unable to find what you’re looking for. Please try another search.
        </h2>
      </div>
      <div class="movies-container" id="movies-container"></div>
    </main>
  </body>
</html>
